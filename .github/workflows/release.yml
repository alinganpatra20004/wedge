#
# Release pipeline (threat model T6.1, T6.2, T6.9). A tag v* builds every
# target, packages them, writes SHA256SUMS, attests build provenance and
# publishes a GitHub Release. A manual run builds everything without
# publishing, to test the pipeline.

name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-audit,cargo-deny
      - run: cargo audit
      - run: cargo deny check
      - run: cargo test --all --locked -q

  linux:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: sudo apt-get update && sudo apt-get install -y pandoc
      - run: pwsh scripts/render-guide.ps1
      - run: pwsh scripts/build-all.ps1 -SkipWindows
      # Signs the .deb/.rpm with the project key (public half:
      # packaging/wedge-release.asc). The key never leaves the environment.
      - env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: docker run --rm -e GPG_PRIVATE_KEY -v "$PWD:/src" -w /src --entrypoint sh goreleaser/nfpm:v2.41.1 scripts/package-linux.sh
      - run: sh scripts/build-oci.sh amd64 && sh scripts/build-oci.sh arm64
      - run: docker run --rm -v "$PWD:/src" -w /src rust:1-bookworm sh scripts/sbom.sh
      # The built artifacts, not just Cargo.lock: the binaries carry their
      # dependency list (cargo auditable). Any finding blocks the release.
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-audit
      - run: cargo audit bin build/*-linux-*/wedge
      - run: |
          for arch in amd64 arm64; do
            docker run --rm -v "$PWD/build:/b:ro" aquasec/trivy:0.56.2 image \
              --input "/b/wedge-$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)-oci-$arch.tar" \
              --scanners vuln,secret --severity HIGH,CRITICAL --exit-code 1 \
              --db-repository ghcr.io/aquasecurity/trivy-db:2
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: build/

  windows:
    needs: gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - run: choco install pandoc -y --no-progress
      - run: pwsh scripts/render-guide.ps1
      - run: pwsh scripts/build-all.ps1 -SkipLinux
      - run: pwsh scripts/build-msi.ps1
      # Real install, service start, HTTP check and uninstall on the runner.
      - run: pwsh scripts/test-msi.ps1 (Get-ChildItem build/*.msi).FullName
      # Authenticode signing through SignPath Foundation (threat model T6.1).
      # Off until the project is approved and SIGNPATH_API_TOKEN exists.
      - id: unsigned
        if: env.SIGNPATH_API_TOKEN != ''
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-unsigned
          path: |
            build/*.msi
            build/*.zip
      - if: env.SIGNPATH_API_TOKEN != ''
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        uses: signpath/github-action-submit-signing-request@ced31329c0317e779dad2eec2a7c3bb46ea1343e # v1.3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: wedge
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: build/signed
      - if: env.SIGNPATH_API_TOKEN != ''
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: Copy-Item -Force build/signed/* build/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: build/

  macos:
    needs: gate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - run: brew install pandoc
      - run: pwsh scripts/render-guide.ps1
      - run: pwsh scripts/build-all.ps1 -MacOS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: build/

  publish:
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: build/
          merge-multiple: true
      - run: pwsh scripts/build-all.ps1 -ChecksumsOnly
      - run: cd build && sha256sum -c SHA256SUMS
      - run: cp packaging/wedge-release.asc build/
      # Sigstore keyless signatures: each asset gets <file>.sigstore.json,
      # verifiable with `cosign verify-blob` against this workflow's identity.
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1
      - if: startsWith(github.ref, 'refs/tags/v')
        run: |
          for f in $(find build -maxdepth 1 -type f ! -name '*.sigstore.json'); do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            build/*.tar.gz
            build/*.zip
            build/*.deb
            build/*.rpm
            build/*.tar
            build/*.msi
            build/*.cdx.json
            build/SHA256SUMS
      - if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=$(find build -maxdepth 1 -type f)
          gh release create "$GITHUB_REF_NAME" $files \
            --verify-tag --title "wedge $GITHUB_REF_NAME" --notes-file packaging/RELEASE_NOTES.md
      - if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dry-run
          path: build/
