[workspace]
resolver = "2"
members = ["crates/wedge-core", "crates/wedge-config", "crates/wedge"]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0"
authors = ["Alingan Patra"]
repository = "https://github.com/alinganpatra20004/wedge"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
panic = "abort"
