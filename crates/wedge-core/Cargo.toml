[package]
name = "wedge-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
bytes = "1.12.1"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1.20", features = ["tokio", "server", "server-auto", "server-graceful", "http1", "http2"] }
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "net", "macros", "signal", "time", "sync"] }
tracing = "0.1.44"
wedge-config = { version = "0.1.0", path = "../wedge-config" }

[dev-dependencies]
bytes = "1.12.1"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "http2"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "net", "macros", "io-util", "time"] }
