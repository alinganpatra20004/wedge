[package]
name = "wedge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
clap = { version = "4.5.61", features = ["derive"] }
rpassword = "7.5.0"
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
wedge-config = { version = "0.2.0", path = "../wedge-config" }
wedge-core = { path = "../wedge-core", version = "0.2.0" }
zeroize = "1.8.2"

[lints]
workspace = true

[features]
# See wedge-core: IP/TCP header capture through libpcap/Npcap.
packet-capture = ["wedge-core/packet-capture"]

[dev-dependencies]
tempfile = "3.27.0"

[target."cfg(windows)".dependencies]
windows-service = "0.8.1"

# Windows icon and version info (build.rs). Pinned to 0.1.23, the last release
# on toml 0.8, which the rest of the workspace uses; later ones pull a second
# toml stack (serde_spanned 1.x).
[target."cfg(windows)".build-dependencies]
winresource = "=0.1.23"
