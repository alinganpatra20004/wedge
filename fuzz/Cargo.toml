[package]
name = "wedge-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
wedge-config = { path = "../crates/wedge-config" }

# Keep the fuzz crate out of the main workspace.
[workspace]
members = ["."]

[[bin]]
name = "config_parse"
path = "fuzz_targets/config_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "secret_ref"
path = "fuzz_targets/secret_ref.rs"
test = false
doc = false
bench = false
