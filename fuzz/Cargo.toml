[package]
name = "wedge-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
wedge-config = { path = "../crates/wedge-config" }
wedge-core = { path = "../crates/wedge-core" }

# Keep the fuzz crate out of the main workspace.
[workspace]
members = ["."]

[[bin]]
name = "config_parse"
path = "fuzz_targets/config_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "secret_ref"
path = "fuzz_targets/secret_ref.rs"
test = false
doc = false
bench = false

[[bin]]
name = "request_path"
path = "fuzz_targets/request_path.rs"
test = false
doc = false
bench = false

[[bin]]
name = "proxy_request"
path = "fuzz_targets/proxy_request.rs"
test = false
doc = false
bench = false

[[bin]]
name = "request_headers"
path = "fuzz_targets/request_headers.rs"
test = false
doc = false
bench = false