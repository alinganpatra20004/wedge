<!-- wEdge logo: icon and wordmark, for docs, the README and installer banners. -->
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="256" viewBox="0 0 960 256">
  <defs>
    <linearGradient id="wedge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0369A1"/>
      <stop offset="1" stop-color="#075985"/>
    </linearGradient>
  </defs>
  <g transform="translate(8 8) scale(0.4688)">
    <rect x="16" y="16" width="480" height="480" rx="104" fill="#0B1F3A"/>
    <!-- A 3D wedge (ramp): the lit sloped top, then the shaded front face. -->
    <path d="M104 196 L156 148 L420 340 L368 388 Z" fill="url(#wedge)"/>
    <path d="M104 196 L368 388 L104 388 Z" fill="url(#shade)"/>
    <path d="M368 388 L420 340 L420 388 Z" fill="#06456A"/>
    <path d="M104 388 L420 388" stroke="#5EEAD4" stroke-width="10" stroke-linecap="round" opacity="0.9"/>
  </g>
  <text x="272" y="176" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif"
        font-size="156" font-weight="700" letter-spacing="-4" fill="#0B1F3A">w<tspan fill="#0EA5E9">E</tspan>dge</text>
</svg>
