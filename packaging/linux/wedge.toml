#
# wedge configuration installed by the .deb/.rpm package. Upgrades keep your
# edits. Check changes with: wedge check-config -c /etc/wedge/wedge.toml
# then apply them with: systemctl reload wedge
#
# Out of the box wedge listens on loopback only. To serve the network,
# change listen below (for example "0.0.0.0:80"). Files in conf.d/ are
# merged after this one; see /usr/share/doc/wedge/examples/.

[server]
listen = ["127.0.0.1:8080"]
default_vhost = "default"

[[vhost]]
name = "default"
root = "/usr/share/wedge/www"

# Strict browser security headers for the bundled page. A real site usually
# needs these adjusted; see "Response headers" in docs/guide/security.md.
[vhost.headers]
"Content-Security-Policy" = "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'"
"Permissions-Policy" = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
"Cross-Origin-Resource-Policy" = "same-origin"
