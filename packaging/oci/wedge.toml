#
# Default configuration in the container image. Inside a container wedge must
# listen on all interfaces; publish the port with `-p` to choose exposure.
# Replace this file by mounting your own /etc/wedge.

[server]
listen = ["0.0.0.0:8080"]
default_vhost = "default"

[[vhost]]
name = "default"
root = "/srv/www"

# Strict browser security headers for the bundled page. A real site usually
# needs these adjusted; see "Response headers" in docs/guide/security.md.
[vhost.headers]
"Content-Security-Policy" = "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'"
"Permissions-Policy" = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
"Cross-Origin-Resource-Policy" = "same-origin"
