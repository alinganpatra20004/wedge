# Project-local Semgrep rules; run together with the registry ruleset p/rust.
rules:
  - id: wedge-no-unwrap-in-lib
    languages: [rust]
    severity: WARNING
    message: Avoid unwrap()/expect() in library code; return an error instead.
    patterns:
      - pattern-either:
          - pattern: $X.unwrap()
          - pattern: $X.expect(...)
      # Test modules are named `tests` by convention and may unwrap freely.
      - pattern-not-inside: |
          mod tests { ... }
    paths:
      include: ["**/crates/wedge-core/src/", "**/crates/wedge-config/src/"]
